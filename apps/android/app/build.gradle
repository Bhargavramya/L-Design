plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lalithaeventdecors.decor3d'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lalithaeventdecors.decor3d'
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'none.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias System.getenv('KS_ALIAS') ?: 'decor3d'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
